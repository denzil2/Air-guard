name: air_quality_app
description: Real-time Air Quality Index tracking with geofencing and route optimization.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3
  geolocator: ^14.1.2
  geocoding: ^2.1.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.2
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.0.0
  lottie: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
